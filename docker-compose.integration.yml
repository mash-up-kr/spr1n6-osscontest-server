# 전체 통합 환경. API 서버·릴레이·워커·카프카를 한 번에 띄운다.
#
#   docker compose -f docker-compose.integration.yml --env-file .env.integration up -d
#
# DB 는 띄우지 않는다. dev 환경과 마찬가지로 리모트 Tmax OpenSQL 에 SSH 터널로 붙으므로,
# 컨테이너를 올리기 전에 ./scripts/tunnel.sh start 로 터널이 열려 있어야 한다.
# 컨테이너에서 호스트의 터널 포트로 나가기 위해 host.docker.internal 을 쓴다.
#
# 주의: ssh -L 은 바인드 주소를 주지 않으면 127.0.0.1 에만 붙는다. 컨테이너는 호스트의
# 다른 인터페이스로 들어오므로 그대로면 연결이 거부된다. scripts/tunnel.sh 가
# 0.0.0.0 에 바인딩하도록 바꾸거나, 터널을 컨테이너 안에서 여는 방식이 필요하다.
#
# 로컬 개발용(docker-compose.yml)과 포트·볼륨을 분리해 두 환경을 동시에 띄울 수 있다.
# web 은 컨테이너로 띄우지 않는다. 호스트에서 실행하고 localhost:8080 을 바라보게 한다.

name: aidocs-integration

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aidocs-it-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?.env.integration 에 STORAGE_ACCESS_KEY 가 필요합니다}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?.env.integration 에 STORAGE_SECRET_KEY 가 필요합니다}
      TZ: Asia/Seoul
    ports:
      - "${MINIO_HOST_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9011}:9001"
    volumes:
      - aidocs-it-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: aidocs-it-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?.env.integration 에 STORAGE_BUCKET 이 필요합니다}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${STORAGE_ACCESS_KEY} $${STORAGE_SECRET_KEY} &&
      mc mb --ignore-existing local/$${STORAGE_BUCKET}
      "

  kafka:
    image: apache/kafka:4.0.0
    container_name: aidocs-it-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 컨테이너끼리는 kafka:9092, 호스트에서 붙을 때는 localhost:29092 를 쓴다.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 단일 노드라 복제본을 둘 수 없다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽은 각 서비스가 알아서 만들게 둔다. 자동 생성 시 파티션 수를 릴레이 설정과 맞춘다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      TZ: Asia/Seoul
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - aidocs-it-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 15s

