# local 스택. PostgreSQL·MinIO·API 서버(local 프로파일)·워커를 모두 로컬에서 띄운다.
#
#   docker compose -f docker-compose.local.yml up -d --build                     # 전체
#   docker compose -f docker-compose.local.yml up -d postgres minio minio-init   # gradle 로 앱을 띄우거나 테스트할 때
#
# OPENAI_API_KEY 는 셸 환경 변수나 .env 에서 읽는다. 나머지 값은 로컬 전용으로 여기 고정한다.
# web(React SPA)은 컨테이너로 띄우지 않는다. 호스트에서 실행하고 localhost:8080 을 바라보게 한다.

name: aidocs-local

services:
  postgres:
    # pgvector 가 들어 있는 이미지다. init_schema 가 CREATE EXTENSION vector 를 실행하므로
    # 맨 PostgreSQL 이미지로는 마이그레이션이 실패한다.
    # 0.8.1-pg17 은 DB 클러스터(PostgreSQL 17.8, pgvector 0.8.1)와 버전이 같다.
    image: pgvector/pgvector:0.8.1-pg17
    container_name: aidocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aidocs
      POSTGRES_USER: aidocs
      POSTGRES_PASSWORD: aidocs
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      # initdb 는 데이터 디렉터리가 빌 때만 돈다. 스크립트를 고쳤으면 down -v 로 볼륨을 지우고 다시 올린다.
      - aidocs-postgres-data:/var/lib/postgresql/data
      - ./scripts/local-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidocs -d aidocs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aidocs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aidocs
      MINIO_ROOT_PASSWORD: aidocs1234
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aidocs-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: aidocs-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 aidocs aidocs1234 &&
      mc mb --ignore-existing local/aidocs-documents
      "

  server:
    build: .
    container_name: aidocs-server
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: local
      # local 프로파일의 기본값(localhost)을 컨테이너 서비스 이름으로 바꾼다.
      DB_HOST: postgres
      STORAGE_ENDPOINT: http://minio:9000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # 워커는 워커 저장소가 올린 이미지를 받아 쓴다.
  worker:
    image: ${WORKER_IMAGE:-ghcr.io/mash-up-kr/spr1n6-osscontest-worker:latest}
    container_name: aidocs-worker
    restart: unless-stopped
    depends_on:
      # 스키마는 server 가 기동하며 Flyway 로 만든다.
      server: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/aidocs
      DB_USERNAME: aidocs
      DB_PASSWORD: aidocs
      INDEXING_STORAGE_ENDPOINT: http://minio:9000
      INDEXING_STORAGE_REGION: ap-northeast-2
      INDEXING_STORAGE_BUCKET: aidocs-documents
      AWS_ACCESS_KEY_ID: aidocs
      AWS_SECRET_ACCESS_KEY: aidocs1234
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

volumes:
  aidocs-postgres-data:
  aidocs-minio-data:
