# local 스택. PostgreSQL·MinIO·API 서버(local 프로파일)·워커를 모두 로컬에서 띄운다.
#
#   docker compose -f docker-compose.local.yml up -d --build                     # 전체
#   docker compose -f docker-compose.local.yml up -d postgres minio minio-init   # gradle 로 앱을 띄우거나 테스트할 때
#
# OPENAI_API_KEY 는 셸 환경 변수나 .env 에서 읽는다. 나머지 값은 로컬 전용으로 여기 고정한다.
# web(React SPA)은 컨테이너로 띄우지 않는다. 호스트에서 실행하고 localhost:8080 을 바라보게 한다.

name: aidocs-local

services:
  postgres:
    # pgvector 가 들어 있는 이미지다. init_schema 가 CREATE EXTENSION vector 를 실행하므로
    # 맨 PostgreSQL 이미지로는 마이그레이션이 실패한다.
    # 0.8.1-pg17 은 DB 클러스터(PostgreSQL 17.8, pgvector 0.8.1)와 버전이 같다.
    # Job 회수 스케줄 마이그레이션(V20261014_004)이 pg_cron 을 쓰는데 이 이미지에는 없어서 패키지를 더한다.
    # DB 클러스터는 pg_cron 이 Flyway 밖에서 설치돼 있다는 전제로 동작한다. 로컬도 같은 전제를 맞춘다.
    build:
      context: .
      dockerfile_inline: |
        FROM pgvector/pgvector:0.8.1-pg17
        RUN apt-get update \
            && apt-get install -y --no-install-recommends postgresql-17-cron \
            && rm -rf /var/lib/apt/lists/*
    image: aidocs-local-postgres
    container_name: aidocs-postgres
    restart: unless-stopped
    # pg_cron 은 기동 때 미리 로드해야 CREATE EXTENSION 이 된다.
    # cron.database_name 의 기본값은 postgres 라 작업을 등록하는 aidocs 로 바꾼다.
    # cron.use_background_workers 는 CI 와 달리 DB 클러스터와 같은 기본값(off)으로 둔다.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=aidocs
    environment:
      POSTGRES_DB: aidocs
      POSTGRES_USER: aidocs
      POSTGRES_PASSWORD: aidocs
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      # initdb 는 데이터 디렉터리가 빌 때만 돈다. 스크립트를 고쳤으면 down -v 로 볼륨을 지우고 다시 올린다.
      # pg_cron 추가 전에 만든 볼륨은 지우지 않고 아래를 한 번 실행해도 된다.
      #   docker compose -f docker-compose.local.yml exec postgres psql -U aidocs -d aidocs -c "CREATE EXTENSION IF NOT EXISTS pg_cron"
      - aidocs-postgres-data:/var/lib/postgresql/data
      - ./scripts/local-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidocs -d aidocs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    # 공식 minio/minio·minio/mc 이미지는 더 이상 받을 수 없어 Bitnami 레거시 이미지를 쓴다.
    image: bitnamilegacy/minio:2025.7.23
    container_name: aidocs-minio
    restart: unless-stopped
    # 공식 이미지가 root 로 만든 기존 볼륨을 그대로 읽으려고 root 로 띄운다. 이미지 기본 사용자(1001)는 쓰기 권한이 없다.
    user: "0"
    environment:
      MINIO_ROOT_USER: aidocs
      MINIO_ROOT_PASSWORD: aidocs1234
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aidocs-minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21
    container_name: aidocs-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 aidocs aidocs1234 &&
      mc mb --ignore-existing local/aidocs-documents
      "

  server:
    build: .
    container_name: aidocs-server
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: local
      # local 프로파일의 기본값(localhost)을 컨테이너 서비스 이름으로 바꾼다.
      DB_HOST: postgres
      STORAGE_ENDPOINT: http://minio:9000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # 워커는 워커 저장소가 올린 이미지로 두 인스턴스를 띄운다.
  worker:
    image: ${WORKER_IMAGE:-ghcr.io/mash-up-kr/spr1n6-osscontest-worker:latest}
    deploy:
      replicas: 2
    restart: unless-stopped
    depends_on:
      # 스키마는 server 가 기동하며 Flyway 로 만든다.
      server: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/aidocs
      DB_USERNAME: aidocs
      DB_PASSWORD: aidocs
      INDEXING_STORAGE_ENDPOINT: http://minio:9000
      INDEXING_STORAGE_REGION: ap-northeast-2
      INDEXING_STORAGE_BUCKET: aidocs-documents
      AWS_ACCESS_KEY_ID: aidocs
      AWS_SECRET_ACCESS_KEY: aidocs1234
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

volumes:
  aidocs-postgres-data:
  aidocs-minio-data:
