services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    container_name: aidocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aidocs
      POSTGRES_USER: aidocs
      POSTGRES_PASSWORD: aidocs
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - aidocs-postgres-data:/var/lib/postgresql/data
      - ./scripts/local-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidocs -d aidocs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aidocs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aidocs
      MINIO_ROOT_PASSWORD: aidocs1234
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aidocs-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: aidocs-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 aidocs aidocs1234 &&
      mc mb --ignore-existing local/aidocs-documents
      "

volumes:
  aidocs-postgres-data:
  aidocs-minio-data:
