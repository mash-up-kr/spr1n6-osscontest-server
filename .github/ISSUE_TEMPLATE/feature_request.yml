name: Feature request
description: 새 기능이나 개선을 제안합니다. / Suggest a new feature or an improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        어떤 문제를 풀고 싶은지 적어 주세요. 해결 방법보다 문제를 먼저 적습니다.
        Describe the problem you want to solve, before any solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: |
        제안하는 방법을 적어 주세요. API나 동작이 어떻게 바뀌는지 적으면 좋습니다.
        Describe your proposed solution, including how the API or behavior would change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        검토한 다른 방법과 고르지 않은 이유를 적어 주세요.
        Other approaches you considered, and why you did not choose them.

  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: 이 기능을 구현하는 PR을 올릴 수 있습니다. / I am willing to submit a PR.
