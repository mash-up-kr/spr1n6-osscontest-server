# 테스트는 local 프로파일로 PostgreSQL(pgvector, pgcrypto, pg_cron)과 MinIO 에 붙는다.
# 기존 PostgreSQL 서비스에 pg_cron을 설치하고 재시작한 뒤 테스트를 실행한다.
name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # init_schema 가 CREATE EXTENSION vector 를 실행하므로 pgvector 이미지가 필요하다.
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: aidocs
          POSTGRES_USER: aidocs
          POSTGRES_PASSWORD: aidocs
          TZ: Asia/Seoul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidocs -d aidocs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        # docker-compose.local.yml 과 같은 이미지다.
        image: bitnamilegacy/minio:2025.7.23
        env:
          MINIO_ROOT_USER: aidocs
          MINIO_ROOT_PASSWORD: aidocs1234
          MINIO_DEFAULT_BUCKETS: aidocs-documents
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: pg_cron 설치 및 PostgreSQL 재시작
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec --user root "$POSTGRES_CONTAINER" bash -ec '
            apt-get update
            apt-get install -y --no-install-recommends postgresql-17-cron
          '

          # pg_cron은 시작 시 로드해야 하므로 설정 후 DB를 재시작한다.
          docker exec -i --user postgres "$POSTGRES_CONTAINER" \
            sh -c 'cat >> "$PGDATA/postgresql.conf"' <<'CONF'
          shared_preload_libraries = 'pg_cron'
          cron.database_name = 'aidocs'
          cron.use_background_workers = on
          CONF
          docker restart "$POSTGRES_CONTAINER"

          for ((attempt = 0; attempt < 30; attempt++)); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -h 127.0.0.1 -U aidocs -d aidocs; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$POSTGRES_CONTAINER"
          exit 1

      - name: PostgreSQL 확장 설치
        env:
          PGPASSWORD: aidocs
        run: |
          psql -h localhost -U aidocs -d aidocs -v ON_ERROR_STOP=1 -f scripts/local-db/00-extensions.sql
          psql -h localhost -U aidocs -d aidocs -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pg_cron;"
          # 알림 테스트는 pgvector/Spring 없이 전용 DB 에 실제 큐 마이그레이션을 적용한다.
          psql -h localhost -U aidocs -d aidocs -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE aidocs_notify_test;"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트
        env:
          INDEXING_NOTIFY_TEST_URL: jdbc:postgresql://localhost:5432/aidocs_notify_test
          INDEXING_NOTIFY_TEST_USERNAME: aidocs
          INDEXING_NOTIFY_TEST_PASSWORD: aidocs
        run: ./gradlew test

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
