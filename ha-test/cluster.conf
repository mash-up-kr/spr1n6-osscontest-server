# 시험 대상 클러스터. 기능테스트 시험 절차 2절 "테스트 환경"의 값이다.
#
# 같은 키에 HA_ 를 붙인 환경변수나 저장소 루트 .env 의 HA_ 키가 있으면 그 값을 쓴다.
#   HA_DB01_SSH=my-db-01 ./ha-test/ha-test status
#
# DB 계정은 .env 의 DB_USERNAME·DB_PASSWORD 를 쓴다(HA_DB_USER·HA_DB_PASSWORD 가 있으면 그 값).

# 노드. 노드마다 SSH 접속 대상(~/.ssh/config 별칭 또는 user@host), 사설 IP, Patroni 멤버 이름을 적는다.
NODES=db-01 db-02 db-03
DB01_SSH=ha-db-01
DB01_IP=10.40.1.11
DB01_MEMBER=postgresql1
DB02_SSH=ha-db-02
DB02_IP=10.40.1.12
DB02_MEMBER=postgresql2
DB03_SSH=ha-db-03
DB03_IP=10.40.1.13
DB03_MEMBER=postgresql3

# 기준 상태. 모든 시험은 이 상태에서 시작하고 끝나면 이 상태로 돌아온다.
PRIMARY=db-01
VIP_OWNER=db-02
STANDBY_PROXY=db-03

# 기록 도구와 Patroni 조회를 돌리는 노드. VIP 가 사설 IP 라 쓰기 기록은 VPC 안에서 보내야 한다.
# H-3 에서 꺼지는 PRIMARY 와 달라야 한다.
OBSERVER=db-03
# H-6 에서 멈췄다 되살리는 Replica.
H6_STOP_NODE=db-03

# 접속 경로
VIP=10.40.1.100
VIP_PORT=6432
WRITE_POOL=aidocs_session
DATABASE=aidocs
DB_USER=aidocs
PROBE_TABLE=ha_test.probe

# 서버 안의 경로와 계정
DB_OS_USER=opensql
PATRONI_PORT=8008
PATRONI_CONFIG=/home/opensql/etc/patroni/patroni.yml
PG_SOCKET_DIR=/home/opensql/tmp
REMOTE_DIR=/home/opensql/ha-test

# VIP 가 AWS 에서도 옮겨졌는지(보조 사설 IP 가 붙은 ENI) OpenProxy 노드의 인스턴스 메타데이터로 확인한다.
AWS_VIP_CHECK=1

# 노드 모니터링 대시보드(docker-compose.monitoring.yml). 시험 사건(장애 주입·새 Leader·원복)을 세로선으로 찍는다.
# 비워 두면 찍지 않는다. 비밀번호는 .env 의 GRAFANA_ADMIN_PASSWORD 를 쓰고, 없으면 compose 기본값(admin)이다.
GRAFANA_URL=http://localhost:3030
GRAFANA_DASHBOARD_UID=opensql-ha-nodes
GRAFANA_USER=admin

# H-2 에서 부르는 앱. dev 프로필로 띄운 server 다.
APP_URL=http://localhost:8080
APP_USER_ID=1
# 검색 질의. | 로 나눈다. 하나 이상이 결과를 돌려줘야 H-2 를 시작한다.
SEARCH_QUERIES=국회 예산안 처리 기한|기후변화와 코로나19 위기|정기국회 일정
