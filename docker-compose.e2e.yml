# 로컬 E2E 리허설용 오버레이. docker-compose.integration.yml 위에 얹어 쓴다.
#
#   docker compose \
#     -f docker-compose.integration.yml \
#     -f docker-compose.e2e.yml \
#     --env-file .env.integration up -d --build
#
# 목적은 하나다. 넷이 각자 만든 서비스가 실제로 이어지는지 내 컴퓨터에서 먼저 확인한다.
# 업로드 -> 릴레이 -> 워커 -> 검색이 한 번이라도 끝까지 통과하는 것을 본 뒤에 서버에 올린다.
#
# 통합 컴포즈와 다른 점은 DB 하나다. 리모트 Tmax OpenSQL 대신 로컬 PostgreSQL 을 쓴다.
# 그래서 이렇게 된다.
#
#   - 공유 DB 에 마이그레이션이 적용되지 않는다. 인프라 담당자의 승인을 기다릴 필요가 없고,
#     스키마가 잘못돼도 내 컨테이너만 지우면 끝난다.
#   - SSH 터널과 pem 이 필요 없다.
#   - DB_ENCRYPTION_KEY 가 무슨 값이든 된다. 빈 DB 라 복호화할 기존 암호문이 없다.
#
# 대신 이것은 확인하지 못한다. 배포 환경에서 따로 확인한다.
#
#   - ARIA-256 암호화. ARIA 는 Tmax OpenCrypto 에만 있어 로컬 pgcrypto 로는 돌지 않는다.
#     아래에서 server 에 aes256 을 넣어 같은 코드가 AES 로 돌게 한다.
#   - Patroni HA 구성과 Tmax OpenSQL 고유 동작.
#
# 구현 메모: db-tunnel 서비스를 지우지 않고 그 자리에 PostgreSQL 을 넣는다. 컴포즈는 오버레이로
# 서비스를 삭제할 수 없고, 다른 서비스들이 이미 db-tunnel:5432 를 바라보고 있다. 이름만 터널이고
# 실제로 DB 인 컨테이너를 놓으면 relay·worker·server 의 접속 설정을 하나도 손대지 않아도 된다.
# 이름이 내용과 어긋나는 것은 이 파일이 리허설용이고 수명이 짧기 때문에 감수한다.
#
# 요구 사항: Docker Compose v2.24 이상 (!reset, !override 태그).

name: aidocs-integration

services:
  db-tunnel:
    # pgvector 가 들어 있는 이미지다. init_schema 가 CREATE EXTENSION vector 를 실행하므로
    # 맨 PostgreSQL 이미지로는 마이그레이션이 실패한다.
    image: pgvector/pgvector:pg17
    # 원래 값은 ssh -N ... 이다. 지우지 않으면 PostgreSQL 대신 ssh 를 실행한다.
    command: !reset null
    # 원래는 pem 을 읽기 전용으로 마운트한다. 여기서는 pem 이 필요 없고,
    # 대신 pgcrypto 를 설치하는 초기화 스크립트를 넣는다.
    #
    # initdb 는 데이터 디렉터리가 빌 때만 돈다. 스크립트나 스키마를 고쳤으면
    # docker compose ... down -v 로 볼륨을 지우고 다시 올려야 반영된다.
    volumes: !override
      - ./scripts/local-db:/docker-entrypoint-initdb.d:ro
      - aidocs-e2e-db-data:/var/lib/postgresql/data
    environment: !override
      # .env.integration 의 DB 접속 정보를 그대로 재사용한다. 값이 리모트와 같아도
      # 붙는 곳은 이 컨테이너라 리모트에 영향이 없다.
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    healthcheck: !override
      # 원래 헬스체크는 터널 포트가 열렸는지를 netstat 으로 본다. DB 에는 맞지 않는다.
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  server:
    environment:
      # 로컬 pgcrypto 에는 ARIA 가 없다. 이 값을 넣지 않으면 기본값 aria256 으로
      # app_encrypt 가 실패하고, 문서 업로드가 파일명 암호화 단계에서 끊긴다.
      DB_ENCRYPTION_CIPHER: aes256

volumes:
  aidocs-e2e-db-data: