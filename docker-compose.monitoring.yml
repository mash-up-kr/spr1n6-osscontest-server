# 노드 모니터링 스택. DB 노드·OpenProxy·VIP·etcd 상태를 Grafana 대시보드로 보여 준다.
#
#   docker compose -f docker-compose.monitoring.yml up -d
#   http://localhost:3030   대시보드 "OpenSQL HA 노드 현황"이 첫 화면이다
#
# 자료는 Patroni(8008)·etcd(2379)·OpenProxy(9930)가 내보내는 지표와, 지표로 나오지 않는 VIP 위치·OpenProxy 응답을
# cluster-tunnel 이 직접 확인한 값이다. 클러스터 포트는 밖에서 막혀 있어 SSH 터널로 가져온다.
# .env 의 SSH_* 를 dev 스택과 같이 쓴다. dev 스택과 따로 띄우고 따로 내린다.

name: aidocs-monitoring

services:
  cluster-tunnel:
    image: alpine:3.20
    container_name: aidocs-monitoring-cluster-tunnel
    restart: unless-stopped
    environment:
      SSH_HOST: ${SSH_HOST:?.env 에 SSH_HOST 가 필요합니다}
      SSH_PORT: ${SSH_PORT:-22}
      SSH_USER: ${SSH_USER:?.env 에 SSH_USER 가 필요합니다}
      TZ: Asia/Seoul
    volumes:
      - ${SSH_KEY_PATH:?.env 에 SSH_KEY_PATH 가 필요합니다}:/key:ro
      - ./monitoring/cluster-tunnel:/opt/monitoring:ro
    # 터널 포트와 하는 일은 entrypoint.sh 머리 주석에 있다.
    entrypoint: [ "sh", "/opt/monitoring/entrypoint.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "netstat -ltn | grep -q ':8003' && netstat -ltn | grep -q ':9100'" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: aidocs-monitoring-prometheus
    restart: unless-stopped
    depends_on:
      cluster-tunnel: { condition: service_healthy }
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=14d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - aidocs-monitoring-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.1.1
    container_name: aidocs-monitoring-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # 로그인 없이 보기만 할 수 있게 연다. 포트는 이 Mac 에만 열린다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/opensql-ha-nodes.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 2s
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      TZ: Asia/Seoul
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - aidocs-monitoring-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3030}:3000"

volumes:
  aidocs-monitoring-prometheus-data:
  aidocs-monitoring-grafana-data:
