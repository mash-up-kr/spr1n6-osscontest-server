spring:
  application:
    name: aidocs-server
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  profiles:
    default: local
  datasource:
    hikari:
      connection-init-sql: "SELECT set_config('app.encryption_key', '${DB_ENCRYPTION_KEY}', false)"
  jpa:
    open-in-view: false
  ai:
    model:
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      timeout: 5s
      max-retries: 2
      embedding:
        model: text-embedding-3-small
        dimensions: 1536
        encoding-format: float

logging:
  pattern:
    # 로그에 요청의 traceId 를 붙여 추적성 유지
    level: "%5p [%X{traceId:-}]"

server:
  tomcat:
    # 풀지 않으면 크기 초과 업로드에서 톰캣이 응답 전에 연결을 끊어 413 이 클라이언트에 닿지 않는다.
    max-swallow-size: -1

search:
  default-top-k: 10
  max-top-k: 50
  max-context-window: 5
  min-ef-search: 1
  max-ef-search: 500
  embedding:
    dimensions: 1536
