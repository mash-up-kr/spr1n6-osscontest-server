spring:
  application:
    name: aidocs-server
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  profiles:
    default: local
  datasource:
    hikari:
      connection-init-sql: "SELECT set_config('app.encryption_key', '${DB_ENCRYPTION_KEY}', false)"
  jpa:
    open-in-view: false

logging:
  pattern:
    # 로그에 요청의 traceId 를 붙여 추적성 유지
    level: "%5p [%X{traceId:-}]"

server:
  tomcat:
    max-swallow-size: -1
    
search:
  default-top-k: 10
  max-top-k: 50
  max-context-window: 5
  embedding:
    base-url: http://localhost:8081
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
