spring:
  application:
    name: aidocs-server
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  profiles:
    default: local
  datasource:
    hikari:
      # ARIA 는 Tmax OpenCrypto 확장에만 있어 로컬 pgcrypto 에서는 쓸 수 없다. local 프로필이 aes256 으로 덮는다.
      connection-init-sql: "SELECT set_config('app.encryption_key', '${DB_ENCRYPTION_KEY}', false), set_config('app.encryption_cipher', '${DB_ENCRYPTION_CIPHER:aria256}', false)"
  jpa:
    open-in-view: false
  ai:
    model:
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      timeout: 5s
      max-retries: 2
      embedding:
        model: text-embedding-3-small
        dimensions: 1536
        encoding-format: float

logging:
  pattern:
    # 로그에 요청의 traceId 를 붙여 추적성 유지
    level: "%5p [%X{traceId:-}]"

server:
  tomcat:
    max-swallow-size: -1

# 값을 주지 않으면 기동을 막는다. 잘못된 origin 으로 뜨면 프론트 요청이 전부 막힌다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

search:
  default-top-k: 10
  max-top-k: 50
  max-context-window: 5
  embedding:
    dimensions: 1536
