# 배포용 오버레이. base 위에 얹어 쓴다.
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.deploy.yml \
#     --env-file .env.deploy up -d
#
# base 와 다른 점 세 가지다.
#
#   1. caddy 를 세워 HTTPS 를 종료한다. 프론트가 버셀(HTTPS)에 있어 백엔드도 HTTPS 여야 한다.
#      아니면 브라우저가 요청을 전부 차단한다(mixed content). 정적 파일은 서빙하지 않는다.
#
#   2. db 가 컨테이너 PostgreSQL 이 아니라 호스트 DB 로 가는 TCP 중계기다. 이 스택은 DB 와
#      같은 호스트에서 돌기 때문에 SSH 로 나갔다 들어올 이유가 없다. 자세한 근거는 아래
#      서비스 주석에 적었다.
#
#   3. caddy 를 뺀 나머지는 루프백에만 묶는다. base 가 포트를 "${XXX_HOST_PORT}:내부포트"
#      로 쓰고 있어서, .env.deploy 에서 XXX_HOST_PORT 에 "127.0.0.1:8080" 처럼 바인드 주소까지
#      적으면 그대로 루프백 바인딩이 된다(컴포즈가 문자열을 먼저 치환하고 나서 파싱한다).
#      env 로 못 막는 건 kafka-ui 뿐이라 그것만 아래에서 덮는다.
#
# 요구 사항: Docker Compose v2.24 이상 (!override, !reset 태그).

services:
  # ---------------------------------------------------------------------------
  # 이름은 db 이지만 DB 를 띄우지 않는다. 호스트의 PostgreSQL 로 TCP 를 중계한다.
  #
  # 왜 SSH 터널(docker-compose.tunnel.yml)을 쓰지 않는가. 그 오버레이는 리모트 DB 를
  # 전제로 만들어졌다. 이 스택은 DB 와 같은 호스트에서 도므로, SSH 터널을 그대로 쓰면
  # 컨테이너가 자기 호스트로 SSH 로 나갔다가 다시 들어오는 모양이 된다. 그러려면 서버에
  # pem 을 두고 sshd 를 거쳐야 하고, 장애 지점(키 만료, sshd 설정, 연결 끊김)이 얻는 것
  # 없이 늘어난다.
  #
  # 직접 붙어도 되는 근거는 서버에서 확인했다. pg_hba.conf 가 `host all all all md5` 이므로
  # 도커 브리지 대역에서 온 연결도 비밀번호로 인증한다. 설정을 고칠 필요가 없다.
  #
  # 서비스 이름을 바꾸지 않는 이유는 server·relay·worker 가 이미 db:5432 를 보고 있기
  # 때문이다. 이름만 유지하면 그쪽 접속 설정을 하나도 손대지 않는다.
  # ---------------------------------------------------------------------------
  db:
    image: alpine:3.20
    # 원래 값은 postgres 이미지의 entrypoint 다. 지우지 않으면 중계 대신 DB 가 뜬다.
    command: !reset null
    entrypoint:
      - sh
      - -c
      # fork 는 연결마다 자식을 띄운다는 뜻이다. 없으면 첫 연결이 끊길 때 중계가 함께 끝나고,
      # 커넥션 풀이 재접속하는 순간부터 전부 실패한다.
      - |
        apk add --no-cache socat >/dev/null &&
        exec socat -d TCP-LISTEN:5432,fork,reuseaddr TCP:pghost:5432
    extra_hosts:
      # 도커가 호스트를 가리키는 주소로 바꿔 준다. 172.17.0.1 을 직접 적으면 브리지 설정이
      # 다른 환경에서 조용히 틀린 곳을 가리킨다.
      - "pghost:host-gateway"
    # base 는 initdb 스크립트와 데이터 볼륨을 마운트한다. 여기서는 DB 를 띄우지 않으므로 지운다.
    volumes: !reset null
    environment: !override
      TZ: Asia/Seoul
    healthcheck: !override
      # busybox netstat 으로 중계 포트가 열렸는지만 본다. socat 은 대상이 죽어도 계속 listen
      # 하므로, 이 체크는 "중계기가 살아 있다"까지만 보장하고 DB 가 살아 있는지는 보지 않는다.
      # DB 상태는 server 의 actuator/health 가 잡는다.
      test: [ "CMD-SHELL", "netstat -ltn | grep -q ':5432'" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  server:
    environment:
      # 호스트 DB 는 Tmax OpenSQL 이라 OpenCrypto 가 있다. base 의 aes256 을 되돌린다.
      DB_ENCRYPTION_CIPHER: ${DB_ENCRYPTION_CIPHER:-aria256}

  caddy:
    image: caddy:2.10-alpine
    container_name: aidocs-it-caddy
    restart: unless-stopped
    depends_on:
      # Caddy 는 reverse_proxy 대상을 요청이 올 때 해석하므로 server 가 늦어도 기동은 된다.
      # 그래도 첫 요청이 502 로 나가지 않도록 healthy 를 기다린다.
      server: { condition: service_healthy }
    environment:
      # Caddyfile 이 읽는다. 인증서를 이 이름으로 발급받으므로 실제로 이 서버를 가리켜야 한다.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?.env.deploy 에 PUBLIC_DOMAIN 이 필요합니다}
      TZ: Asia/Seoul
    ports:
      # 80 은 리다이렉트용이 아니다. Let's Encrypt 가 도메인 소유를 확인할 때 쓰므로
      # 닫으면 인증서 발급이 실패한다.
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서가 여기 남는다. 이 볼륨이 없으면 컨테이너를 다시 만들 때마다 발급을
      # 새로 요청하고, Let's Encrypt 한도(도메인당 주 50건, 실패 시간당 5건)에 걸려 한동안
      # 아예 발급이 막힌다.
      - aidocs-caddy-data:/data
      - aidocs-caddy-config:/config

  kafka-ui:
    # base 는 KAFKA_UI_HOST_PORT 로 포트를 받지만 바인드 주소까지는 강제하지 못한다.
    # 인증이 없어서 밖에 열리면 누구나 토픽과 메시지를 읽는다. 배포에서는 루프백만 남긴다.
    # 볼 일이 있으면 SSH 로컬 포워딩으로 본다:
    #   ssh -L 8081:127.0.0.1:8081 rocky@<server>
    #
    # ports 는 컴포즈가 파일을 합칠 때 이어 붙이는 항목이라, 그냥 다시 적으면 0.0.0.0
    # 바인딩이 지워지지 않고 하나 더 늘어난다. !override 로 목록을 대체한다.
    ports: !override
      - "127.0.0.1:${KAFKA_UI_HOST_PORT:-8081}:8080"

volumes:
  aidocs-caddy-data:
  aidocs-caddy-config:
