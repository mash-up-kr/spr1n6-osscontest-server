services:
  postgres:
    # 스키마에 VECTOR 타입이 있어 pgvector 가 포함된 이미지를 쓴다.
    # postgres 공식 이미지 기반이라 환경변수와 볼륨 설정은 그대로 유효하다.
    image: pgvector/pgvector:pg17
    container_name: aidocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aidocs
      POSTGRES_USER: aidocs
      POSTGRES_PASSWORD: aidocs
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - aidocs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidocs -d aidocs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  aidocs-postgres-data:
