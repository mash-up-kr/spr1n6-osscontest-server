# 전체 스택. API 서버·릴레이·워커·카프카·DB 를 한 번에 띄운다.
#
#   docker compose up -d --build
#
# DB 를 컨테이너로 함께 띄우므로 이 파일만으로 완결된다. 처음 받은 사람이 값 하나
# (OPENAI_API_KEY)만 채우면 전체가 돈다.
#
# 공유 DB 나 배포 환경은 이 위에 오버레이를 얹는다. 기본형을 자기완결적인 쪽으로 두고
# 특수한 경우를 얹는 방향이다. 반대로 하면 가장 흔한 경우가 가장 번거로워진다.
#
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d   # 공유 DB
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d   # 배포
#
# web(React SPA)은 컨테이너로 띄우지 않는다. 호스트에서 실행하고 localhost:8080 을 바라보게 한다.

name: aidocs-integration

services:
  db:
    # pgvector 가 들어 있는 이미지다. init_schema 가 CREATE EXTENSION vector 를 실행하므로
    # 맨 PostgreSQL 이미지로는 마이그레이션이 실패한다.
    #
    # 태그를 pg17 로 두면 pg17 최신을 따라가 운영(PostgreSQL 17.8, pgvector 0.8.1)과 어긋난다.
    # 0.8.1-pg17 은 두 버전이 모두 운영과 같다.
    image: pgvector/pgvector:0.8.1-pg17
    container_name: aidocs-it-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aidocs}
      POSTGRES_USER: ${DB_USERNAME:-aidocs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aidocs}
      TZ: Asia/Seoul
    volumes:
      # initdb 는 데이터 디렉터리가 빌 때만 돈다. 스크립트나 스키마를 고쳤으면
      # docker compose down -v 로 볼륨을 지우고 다시 올려야 반영된다.
      - ./scripts/local-db:/docker-entrypoint-initdb.d:ro
      - aidocs-it-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-aidocs} -d ${DB_NAME:-aidocs}" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aidocs-it-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-aidocs}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-aidocs1234}
      TZ: Asia/Seoul
    ports:
      - "${MINIO_HOST_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9011}:9001"
    volumes:
      - aidocs-it-minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: aidocs-it-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-aidocs}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-aidocs1234}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-aidocs-documents}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${STORAGE_ACCESS_KEY} $${STORAGE_SECRET_KEY} &&
      mc mb --ignore-existing local/$${STORAGE_BUCKET}
      "

  kafka:
    image: apache/kafka:4.0.0
    container_name: aidocs-it-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 컨테이너끼리는 kafka:9092, 호스트에서 붙을 때는 localhost:29092 를 쓴다.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 단일 노드라 복제본을 둘 수 없다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽은 각 서비스가 알아서 만들게 둔다. 자동 생성 시 파티션 수를 릴레이 설정과 맞춘다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      TZ: Asia/Seoul
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - aidocs-it-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "${KAFKA_UI_HOST_PORT:-8081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # ---------------------------------------------------------------------------
  # 릴레이와 워커는 각 저장소가 올린 이미지를 받아 쓴다.
  # ---------------------------------------------------------------------------

  server:
    build: .
    container_name: aidocs-it-server
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_ENABLED: "true"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aidocs}
      DB_USERNAME: ${DB_USERNAME:-aidocs}
      DB_PASSWORD: ${DB_PASSWORD:-aidocs}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:-local-only-throwaway-key}
      # ARIA 는 Tmax OpenCrypto 확장에만 있다. 컨테이너 pgcrypto 에는 없으므로 AES-256 을 쓴다.
      # 리모트 Tmax OpenSQL 에 붙는 오버레이가 aria256 으로 덮는다.
      DB_ENCRYPTION_CIPHER: ${DB_ENCRYPTION_CIPHER:-aes256}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-ap-northeast-2}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-aidocs}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-aidocs1234}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-aidocs-documents}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?.env 에 OPENAI_API_KEY 가 필요합니다}
      # web 은 컨테이너가 아니라 호스트에서 뜨므로 호스트 origin 을 허용한다.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${SERVER_HOST_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  relay:
    image: ${RELAY_IMAGE:-ghcr.io/mash-up-kr/spr1n6-osscontest-relay:latest}
    container_name: aidocs-it-relay
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      kafka: { condition: service_healthy }
      # 스키마 때문에 server 를 기다린다. outbox_event 는 server 의 마이그레이션이 만들고,
      # 릴레이는 기동할 때 그 형태가 맞는지 확인만 하고 어긋나면 일부러 기동을 중단한다
      # (잘못된 스키마로 뜨면 발행할 행을 고르는 쿼리가 오류 없이 0건을 돌려주고, 릴레이는
      # "보낼 게 없다"고 판단해 정상인 척하면서 이벤트만 쌓인다). server 가 healthy 면
      # 마이그레이션은 이미 끝난 뒤다.
      server: { condition: service_healthy }
    environment:
      # 릴레이는 자체 변수명 대신 스프링 표준 환경 변수를 그대로 받는다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-aidocs}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-aidocs}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-aidocs}
      # 컨테이너 간 리스너 주소다. 호스트 노출용 localhost:29092 가 아니다.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RELAY_ADMIN_TOKEN: ${RELAY_ADMIN_TOKEN:-}
      TZ: Asia/Seoul
    ports:
      # 액추에이터. /actuator/health, /actuator/prometheus, /actuator/outbox/dead
      - "${RELAY_HOST_PORT:-9090}:9090"
    # 기본값 10초는 릴레이의 정상 종료 예산(드레인 30초, 종료 단계 상한 40초)보다 짧다.
    # 그대로 두면 진행 중인 발행이 끝나기 전에 SIGKILL 이 날아간다.
    stop_grace_period: 45s

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/mash-up-kr/spr1n6-osscontest-worker:latest}
    container_name: aidocs-it-worker
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-aidocs}
      DB_USERNAME: ${DB_USERNAME:-aidocs}
      DB_PASSWORD: ${DB_PASSWORD:-aidocs}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INDEXING_STORAGE_ENDPOINT: http://minio:9000
      INDEXING_STORAGE_REGION: ${STORAGE_REGION:-ap-northeast-2}
      INDEXING_STORAGE_BUCKET: ${STORAGE_BUCKET:-aidocs-documents}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-aidocs}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-aidocs1234}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

volumes:
  aidocs-it-db-data:
  aidocs-it-minio-data:
  aidocs-it-kafka-data:
