# dev 환경 컨테이너. 로컬 개발용은 docker-compose.yml 을 쓴다.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# DB는 리모트 Tmax OpenSQL을 사용한다.
# 접속 정보는 .env 에서 읽으므로 앱과 같은 값을 본다.
# 앱·릴레이·카프카·워커는 각 이미지가 준비되면 여기에 추가한다.

name: aidocs-dev

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aidocs-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?.env 에 STORAGE_ACCESS_KEY 가 필요합니다}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?.env 에 STORAGE_SECRET_KEY 가 필요합니다}
      TZ: Asia/Seoul
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aidocs-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: aidocs-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${STORAGE_ACCESS_KEY} $${STORAGE_SECRET_KEY} &&
      mc mb --ignore-existing local/$${STORAGE_BUCKET}
      "
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?.env 에 STORAGE_ACCESS_KEY 가 필요합니다}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?.env 에 STORAGE_SECRET_KEY 가 필요합니다}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?.env 에 STORAGE_BUCKET 이 필요합니다}

volumes:
  aidocs-minio-data:
