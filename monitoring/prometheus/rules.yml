# 대시보드가 읽는 값. 상태를 숫자 코드로 만들고, 대시보드가 코드를 글자와 색으로 바꿔 보여 준다.
# 모든 값은 노드마다 한 줄이다.

groups:
  # patronictl list 의 Role·State·Lag 를 Patroni 지표로 다시 만든다.
  - name: patroni
    rules:
      # 1 = Patroni REST 응답, 0 = 응답 없음(Patroni 정지 또는 서버 다운).
      - record: opensql:node_up
        expr: max by (node, member, host) (up{job="patroni"})

      # 2 = Leader, 1 = Replica, 0 = 응답 없음.
      - record: opensql:node_role
        expr: |
          max by (node, member, host) (
            (patroni_primary * 2 + patroni_replica)
            or on (node) (up{job="patroni"} == 0)
          )

      # 0 = 응답 없음, 1 = stopped, 2 = running(Leader), 3 = streaming(Replica),
      # 4 = running(Replica, 복제 끊김), 5 = 역할 없음(시작 중 등).
      - record: opensql:node_state
        expr: |
          max by (node, member, host) (
            (
                (1 - patroni_postgres_running)
              + patroni_postgres_running * (
                    patroni_primary * 2
                  + patroni_replica * (4 - patroni_postgres_streaming)
                  + (1 - patroni_primary - patroni_replica) * 5
                )
            )
            or on (node) (up{job="patroni"} == 0)
          )

      # Replica 마다 Leader 가 쓴 WAL 위치에서 Replica 가 받은 위치를 뺀 바이트 수다.
      # 노드마다 수집 시각이 최대 2초 어긋나므로 쓰기가 많을 때는 그만큼 크게 보일 수 있다.
      # Leader 가 없는 동안(교대 중)에는 값을 내지 않는다.
      - record: opensql:replica_lag_bytes
        expr: |
          max by (node, member, host) (
            clamp_min(
                scalar(max(patroni_xlog_location and on (node) patroni_primary == 1))
              - ((patroni_xlog_received_location >= patroni_xlog_replayed_location) or patroni_xlog_replayed_location),
              0
            )
            and on (node) patroni_replica == 1
          )
          and on () (max(patroni_primary) == 1)

  - name: openproxy
    rules:
      # 1 = OpenProxy 가 PostgreSQL 프로토콜로 응답, 0 = 응답 없음. node 는 db-02·db-03·vip.
      - record: opensql:openproxy_up
        expr: max by (node, host) (opensql_openproxy_up)

      # VIP 가 어느 서버에 붙어 있는지. 0 = 어디에도 없음, 2 = db-02, 3 = db-03, 5 = 두 서버 모두.
      # 두 서버 중 하나라도 확인에 실패하면 값을 내지 않는다.
      - record: opensql:vip_location
        expr: |
          sum(opensql_vip_assigned{node="db-02"}) * 2
          + sum(opensql_vip_assigned{node="db-03"}) * 3

      # 클라이언트 연결 수. 풀마다 활성·유휴·대기를 더한다.
      - record: opensql:openproxy_clients
        expr: |
          sum by (node, host, pool) (
            openproxy_pools_cl_active + openproxy_pools_cl_idle + openproxy_pools_cl_waiting
          )

      # 서버 연결을 기다리는 클라이언트 수. 풀이 가득 차면 늘어난다.
      - record: opensql:openproxy_clients_waiting
        expr: sum by (node, host, pool) (openproxy_pools_cl_waiting)

      # DB 로 열린 서버 연결 수. 풀마다 활성·유휴·로그인 중을 더한다.
      - record: opensql:openproxy_server_connections
        expr: |
          sum by (node, host, pool) (
            openproxy_pools_sv_active + openproxy_pools_sv_idle + openproxy_pools_sv_login
          )

  - name: etcd
    rules:
      # 1 = etcd 응답, 0 = 응답 없음.
      - record: opensql:etcd_up
        expr: max by (node, host) (up{job="etcd"})

      # 0 = 응답 없음, 1 = 팔로워, 2 = 리더, 3 = 리더를 모름(과반이 안 모임).
      - record: opensql:etcd_role
        expr: |
          max by (node, host) (
            (
                etcd_server_is_leader * 2
              + (1 - etcd_server_is_leader) * (etcd_server_has_leader + (1 - etcd_server_has_leader) * 3)
            )
            or on (node) (up{job="etcd"} == 0)
          )
